# yazi config — minimal, theme left at default (catppuccin flavor позже)

[manager]
sort_by = "natural"
sort_sensitive = false
show_hidden = false
mouse_support = true
linemode = "size"

[preview]
max_width = 800
max_height = 1200

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Edit (nvim)", for = "unix" },
]
open = [
    { run = 'xdg-open "$@"', desc = "Open with default app", for = "unix" },
]