# hyprlock — follows Brain Shell wallpaper (~/.curr_wall set by WallpaperService)
# Palette: catppuccin-mocha

background {
    path = ~/.curr_wall
    blur_passes = 3
    blur_size = 6
    brightness = 0.75
    contrast = 1.1
    saturation = 1.25
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = false
    outer_color = rgb(89b4fa)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    placeholder_text = <i>Unlock…</i>
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(f9e2af)
    position = 0, -110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cdd6f4, 0.9)
    font_size = 96
    font_family = "JetBrainsMono Nerd Font"
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a %d %b")"
    color = rgba(cdd6f4, 0.65)
    font_size = 22
    font_family = "JetBrainsMono Nerd Font"
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = n3z
    color = rgba(a6adc8, 0.8)
    font_size = 18
    font_family = "JetBrainsMono Nerd Font"
    position = 0, -8
    halign = center
    valign = center
}